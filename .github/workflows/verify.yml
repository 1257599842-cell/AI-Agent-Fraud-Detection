name: Verify project and site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/browser.txt
      - name: Check generated site without dependencies
        run: python -m src.serving.build_demo_page --check
      - name: Install project and browser test dependencies
        run: |
          python -m pip install -r requirements/browser.txt
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Run data-free tests and verify archived evidence
        run: |
          python -m unittest discover -s tests -t .
          python -m src.eval.report_manifest
          python -m src.eval.modelcard_review
      - name: Check real browser rendering and cost formulas
        run: |
          python -m src.serving.check_demo_page --browser chromium
          python -m src.serving.shoot_demo --browser chromium --check-only
